<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#822336;
  --maroon-deep:#5c1726;
  --maroon-tint:#f3e6e9;
  --ink:#1e1719;
  --muted:#6d5f63;
  --paper:#fcfafa;
  --line:#e4d6da;
  --font:"Google Sans Flex","Google Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-size:18px;line-height:1.4}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--maroon);outline-offset:2px}

/* ---------- top ---------- */
header.top{background:var(--maroon);color:#fff;display:flex;align-items:center;gap:16px;padding:14px max(16px,4vw)}
.logo{height:48px;width:auto;display:block;flex:none}
.logo-fallback{height:48px;width:48px;flex:none;border-radius:10px;background:#fff;color:var(--maroon);display:grid;place-items:center;font-weight:700;font-size:28px}
header.top h1{font-size:clamp(20px,3.2vw,30px);font-weight:600;line-height:1.1}
header.top p{font-size:15px;opacity:.88;margin-top:2px}

nav.tabs{background:var(--maroon-deep);display:flex;gap:6px;padding:8px max(16px,4vw) 0;overflow-x:auto}
nav.tabs button{background:transparent;color:#fff;border:0;border-radius:10px 10px 0 0;padding:12px 18px;font-size:17px;font-weight:500;white-space:nowrap;opacity:.8}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--maroon);opacity:1;font-weight:600}
nav.tabs button:hover{opacity:1}

/* ---------- page ---------- */
.wrap{width:min(1100px,100%);margin:0 auto;padding:22px max(16px,4vw) 40px;flex:1}

.daybar{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.daybar button{flex:none;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-size:16px}
.daybar button[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:600}
.daybar button.today:not([aria-pressed="true"]){border-color:var(--maroon);color:var(--maroon);font-weight:600}
.daybar .gap{flex:none;width:1px;height:26px;background:var(--line)}

.periods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.periods span{color:var(--muted);font-size:16px}
.periods button{border:2px solid var(--maroon);background:#fff;color:var(--maroon);border-radius:999px;padding:6px 16px;font-size:16px}
.periods button[aria-pressed="true"]{background:var(--maroon);color:#fff}

.meta{color:var(--muted);font-size:17px;margin-bottom:6px}
h2.sec{font-size:clamp(17px,2.2vw,21px);font-weight:600;color:var(--maroon);margin-bottom:10px}

.target{margin:6px 0 26px;border-left:8px solid var(--maroon);padding:4px 0 4px clamp(14px,2.4vw,28px)}
.target p{font-size:clamp(28px,5.2vw,58px);font-weight:600;line-height:1.14;letter-spacing:-.012em;text-wrap:balance}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card.tint{background:var(--maroon-tint);border-color:var(--line)}
.stack{display:flex;flex-direction:column;gap:22px}

ul.checks{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.chk{width:100%;display:flex;gap:14px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:clamp(18px,2.2vw,22px);line-height:1.3;min-height:52px}
.chk:hover{border-color:var(--maroon)}
.box{flex:none;width:28px;height:28px;border:3px solid var(--maroon);border-radius:7px;background:#fff;display:grid;place-items:center;margin-top:1px}
.chk[aria-checked="true"]{background:var(--maroon-tint);border-color:var(--maroon)}
.chk[aria-checked="true"] .box{background:var(--maroon)}
.chk[aria-checked="true"] .box::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.progress{margin-top:12px;color:var(--muted);font-size:16px}
.progress.done{color:var(--maroon);font-weight:600}

ul.plain{list-style:none;padding:0}
ul.plain li{position:relative;padding-left:20px;margin-bottom:9px;font-size:clamp(17px,2vw,20px)}
ul.plain li::before{content:"";position:absolute;left:0;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--maroon)}
.terms{display:flex;flex-wrap:wrap;gap:8px}
.terms span{background:#fff;border:2px solid var(--maroon);color:var(--maroon-deep);border-radius:999px;padding:3px 14px;font-weight:500;font-size:clamp(16px,2vw,19px)}
.std{margin-top:22px;color:var(--muted);font-size:15px}

.empty{padding:40px 8px;max-width:36em}
.empty h2{font-size:clamp(24px,4vw,36px);font-weight:600;color:var(--maroon);margin-bottom:10px}
.empty p{color:var(--muted);margin-bottom:18px}
.empty button{background:var(--maroon);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:18px}

footer.foot{border-top:1px solid var(--line);padding:12px max(16px,4vw);color:var(--muted);font-size:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
footer.foot .grow{flex:1}
footer.foot button{background:none;border:0;color:var(--maroon);text-decoration:underline;font-size:14px;padding:4px}

dialog{border:0;border-radius:16px;padding:0;width:min(600px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:var(--font);color:var(--ink)}
dialog::backdrop{background:rgba(30,23,25,.55)}
dialog form{padding:24px 26px;display:flex;flex-direction:column;gap:14px}
dialog h3{font-size:22px;color:var(--maroon)}
dialog label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
dialog input[type=text],dialog textarea{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:9px;font-weight:400}
dialog textarea{min-height:80px;resize:vertical}
dialog .hint{font-size:13px;color:var(--muted);font-weight:400}
dialog .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
dialog .row button{padding:10px 18px;border-radius:9px;border:2px solid var(--maroon);background:#fff;color:var(--maroon);font-weight:500}
dialog .row button.primary{background:var(--maroon);color:#fff}
.teacher-banner{background:#fff4d6;border-bottom:1px solid #e6cf8f;color:#5a4400;padding:8px max(16px,4vw);font-size:15px}
</style>
</head>
<body>

<div id="teacherBanner" class="teacher-banner" hidden></div>

<header class="top">
  <div id="logoSlot"></div>
  <div>
    <h1>Learning targets</h1>
    <p id="todayLine"></p>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Choose your class"></nav>

<main class="wrap" id="app" aria-live="polite"></main>

<footer class="foot">
  <span id="status"></span>
  <span class="grow"></span>
  <span id="teacherTools" hidden>
    <button id="tSettings">Teacher setup</button>
    <button id="tRefresh">Reload sheet</button>
  </span>
</footer>

<dialog id="dlg">
  <form method="dialog">
    <h3>Teacher setup</h3>
    <label>Published Google Sheet CSV link
      <input type="text" id="sUrl" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
      <span class="hint">This saves on this device only, for testing. To make the page work for students, paste the link into SHEET_CSV_URL at the top of the HTML file.</span>
    </label>
    <label>Or test with a CSV file
      <input type="file" id="sFile" accept=".csv,text/csv">
    </label>
    <div class="row">
      <button type="button" id="sDemo">Use demo data</button>
      <button type="button" id="sCancel">Close</button>
      <button type="button" class="primary" id="sSave">Save and load</button>
    </div>
  </form>
</dialog>

<script>
/* =====================================================================
   SETTINGS TO EDIT BEFORE SHARING WITH STUDENTS
   ===================================================================== */
const CONFIG = {
  // REQUIRED for students: paste your published-sheet CSV link between the quotes.
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrZNdVL7fkYpz01LTWllFm2J2qOMtlDhMgTULE-ilEDaTWbofSSOoAT4tQlmjjv9N6mqY8sgTDOMAM/pub?gid=48683423&single=true&output=csv",

  REFRESH_MINUTES: 5,

  // code = what you type in the Class column and in ?class=CODE
  CLASSES: [
    { code: "GA1", name: "Graphic Art 1" },
    { code: "GA2", name: "Graphic Art 2" },
    { code: "DA1", name: "Digital Art 1" },
    { code: "FS",  name: "Freshman Success" }
  ],

  // How many posted days to show on each side of the selected day
  DAYS_BEFORE: 5,
  DAYS_AFTER: 6,

  // Paste your school T-mark SVG markup between the backticks (optional).
  LOGO_SVG: ``
};

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const TEACHER = params.get("teacher") === "1";
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const state = { rows: [], classCode: null, date: null, period: null, mode: "none", updated: null, error: "" };

const pad = n => String(n).padStart(2,"0");
const isoFromDate = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dateFromIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const realToday = () => isoFromDate(new Date());
const todayIso = () => (TEACHER && params.get("date")) || realToday();

function parseDate(v){
  v=(v||"").trim(); if(!v) return null;
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return y+"-"+pad(+m[1])+"-"+pad(+m[2]); }
  const d=new Date(v); return isNaN(d)?null:isoFromDate(d);
}
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"||c==="\r"){
      if(c==="\r"&&text[i+1]==="\n") i++;
      row.push(cur); cur="";
      if(row.some(x=>x.trim()!=="")) rows.push(row);
      row=[];
    } else cur+=c;
  }
  row.push(cur);
  if(row.some(x=>x.trim()!=="")) rows.push(row);
  return rows;
}
const FIELD_MAP = {
  date:"date", class:"class", period:"period", unit:"unit",
  learningtarget:"target", target:"target", objective:"target",
  successcriteria:"criteria", criteria:"criteria",
  standard:"standard", standards:"standard",
  vocabulary:"vocab", vocab:"vocab", agenda:"agenda"
};
function rowsFromCSV(text){
  const t=parseCSV(text); if(t.length<2) return [];
  const keys=t[0].map(h=>FIELD_MAP[h.toLowerCase().replace(/[^a-z]/g,"")]||null);
  const out=[];
  for(const r of t.slice(1)){
    const o={}; keys.forEach((k,i)=>{ if(k) o[k]=(r[i]||"").trim(); });
    o.iso=parseDate(o.date);
    if(o.iso && o.class) out.push(o);
  }
  return out;
}
function splitList(s, commas){
  const re = commas ? /\n|\||,|;/ : /\n|\|/;
  return (s||"").split(re).map(x=>x.replace(/^[\s\-•*]+/,"").trim()).filter(Boolean);
}
const classByCode = code => CONFIG.CLASSES.find(c=>c.code.toLowerCase()===(code||"").toLowerCase());
const classMatches = (v,c) => { v=v.trim().toLowerCase(); return v===c.code.toLowerCase()||v===c.name.toLowerCase(); };
const rowsForClass = c => state.rows.filter(r=>classMatches(r.class,c));
const datesForClass = c => [...new Set(rowsForClass(c).map(r=>r.iso))].sort();

/* =====================================================================
   DATA
   ===================================================================== */
function demoCSV(){
  const t=todayIso(), q=s=>'"'+s.replace(/"/g,'""')+'"';
  const rows=[
    ["GA1","1","Photoshop basics","I can use the Move, Marquee, and Lasso tools to select and move part of an image.","I can name the three selection tools | I can make a selection and move it to a new layer | I can undo a mistake with History","ACPro: Selections","layer | selection | marquee | lasso","Do Now: tool name match | Demo: three selection tools | Practice: cut out a shape | Exit check: save to your folder"],
    ["GA2","3","Printshop client projects","I can prepare a print-ready file that meets my client's size and color requirements.","I can set up the document at the right size with bleed | I can convert my images to CMYK | I can export a press-ready PDF","Client brief checklist","bleed | CMYK | crop marks | proof","Client check-in | Build and review layout | Preflight in InDesign | Export and submit proof"],
    ["DA1","2","Drawing in Fresco","I can use layers and brushes in Adobe Fresco to build a simple drawing.","I can add and name at least three layers | I can pick a brush that fits my goal | I can save my work in the right place","Digital art: tools and process","layer | brush | opacity","Sketch warm-up | Brush tour | Work time | Share out"],
    ["FS","4","Typing and SEL","I can type with correct finger placement and stay focused on my goals for the week.","I can find the home row without looking | I can reach a typing goal I set | I can name one focus strategy","SEL: self-management","home row | posture | goal","Goal check-in | Typing practice | Reflection"]
  ];
  return "Date,Class,Period,Unit,Learning Target,Success Criteria,Standard,Vocabulary,Agenda\n"+
    rows.map(r=>[t,r[0],r[1],r[2],q(r[3]),q(r[4]),r[5],q(r[6]),q(r[7])].join(",")).join("\n");
}
async function fetchSheet(url){
  const res=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text=await res.text();
  if(/^\s*<(!doctype|html)/i.test(text)) throw new Error("not a CSV");
  return text;
}
function sheetUrl(){
  return CONFIG.SHEET_CSV_URL || (TEACHER ? (params.get("sheet") || LS.get("lt_url") || "") : "");
}
async function loadData(){
  state.error="";
  const url=sheetUrl();
  if(url){
    try{
      const text=await fetchSheet(url);
      state.rows=rowsFromCSV(text); state.mode="live"; state.updated=new Date();
      LS.set("lt_cache",text); LS.set("lt_cache_time",String(Date.now()));
      return;
    }catch(e){
      const cached=LS.get("lt_cache");
      if(cached){ state.rows=rowsFromCSV(cached); state.mode="cached"; state.updated=new Date(+LS.get("lt_cache_time")||Date.now()); return; }
      state.error=e.message;
    }
  } else if(TEACHER && LS.get("lt_file")){
    state.rows=rowsFromCSV(LS.get("lt_file")); state.mode="file"; state.updated=new Date(); return;
  }
  if(TEACHER){ state.rows=rowsFromCSV(demoCSV()); state.mode="demo"; }
  else { state.rows=[]; state.mode="none"; }
}

/* ---------- self-check storage (stays on the student's device) ---------- */
function checks(){ try{ return JSON.parse(LS.get("lt_checks")||"{}"); }catch(e){ return {}; } }
function checkKey(cls,row,i){ return [cls.code,row.iso,row.period||"",i].join("|"); }
function toggleCheck(key){
  const c=checks(); if(c[key]) delete c[key]; else c[key]=1;
  LS.set("lt_checks",JSON.stringify(c));
}

/* =====================================================================
   RENDER
   ===================================================================== */
function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function section(title){ const d=el("section"); d.appendChild(el("h2","sec",title)); return d; }
const fmtLong = iso => dateFromIso(iso).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const fmtChip = iso => dateFromIso(iso).toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"});
const fmtTime = d => d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});

function renderTabs(){
  const t=$("tabs"); t.innerHTML="";
  CONFIG.CLASSES.forEach(c=>{
    const b=el("button","",c.name);
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", c.code===state.classCode);
    b.onclick=()=>chooseClass(c.code);
    t.appendChild(b);
  });
}

function render(){
  const app=$("app"); app.innerHTML="";
  $("todayLine").textContent = fmtLong(realToday());
  $("status").textContent = statusText();
  renderTabs();

  if(state.mode==="none"){
    const e=el("div","empty");
    e.appendChild(el("h2","",state.error ? "Can't load the targets right now" : "This page isn't connected yet"));
    e.appendChild(el("p","", state.error
      ? "Check your internet connection and try again. If it keeps happening, tell your teacher."
      : "Tell your teacher the learning target page needs to be set up."));
    const b=el("button","","Try again"); b.onclick=refresh; e.appendChild(b);
    app.appendChild(e); return;
  }

  const cls=classByCode(state.classCode);
  if(!cls){
    const e=el("div","empty");
    e.appendChild(el("h2","","Pick your class"));
    e.appendChild(el("p","","Choose a class from the tabs above to see today's learning target."));
    app.appendChild(e); return;
  }

  const dates=datesForClass(cls);
  const today=realToday();

  /* day chips */
  if(dates.length){
    let idx=dates.indexOf(state.date);
    if(idx<0){ idx=dates.filter(d=>d<state.date).length; }
    let lo=Math.max(0,idx-CONFIG.DAYS_BEFORE), hi=Math.min(dates.length,idx+CONFIG.DAYS_AFTER+1);
    const bar=el("div","daybar");
    const tb=el("button","today","Today"); tb.setAttribute("aria-pressed", state.date===today);
    tb.onclick=()=>{ state.date=todayIso(); render(); };
    bar.appendChild(tb); bar.appendChild(el("span","gap"));
    dates.slice(lo,hi).forEach(d=>{
      const b=el("button","",fmtChip(d)+(d===today?" · today":""));
      b.setAttribute("aria-pressed", d===state.date);
      b.onclick=()=>{ state.date=d; render(); };
      bar.appendChild(b);
    });
    app.appendChild(bar);
  }

  const dayRows=rowsForClass(cls).filter(r=>r.iso===state.date)
    .sort((a,b)=>(a.period||"").localeCompare(b.period||"",undefined,{numeric:true}));

  if(!dayRows.length){
    const e=el("div","empty");
    e.appendChild(el("h2","","No target posted for "+fmtLong(state.date)));
    const prev=dates.filter(d=>d<state.date).pop(), next=dates.find(d=>d>state.date);
    e.appendChild(el("p","", dates.length ? "Nothing is posted for this day yet. You can look at the most recent day instead." : "There are no targets posted for this class yet."));
    const go=prev||next;
    if(go){ const b=el("button","","See "+fmtLong(go)); b.onclick=()=>{ state.date=go; render(); }; e.appendChild(b); }
    app.appendChild(e); return;
  }

  /* period chips (only if more than one row that day) */
  let row=dayRows[0];
  if(dayRows.length>1){
    const saved=LS.get("lt_period_"+cls.code);
    row=dayRows.find(r=>r.period===(state.period||saved)) || dayRows[0];
    const p=el("div","periods"); p.appendChild(el("span","","Your period:"));
    dayRows.forEach(r=>{
      const b=el("button","", r.period ? "Period "+r.period : "Section");
      b.setAttribute("aria-pressed", r===row);
      b.onclick=()=>{ state.period=r.period; LS.set("lt_period_"+cls.code,r.period); render(); };
      p.appendChild(b);
    });
    app.appendChild(p);
  }

  /* heading */
  const rel = state.date===today ? "Today's learning target"
            : state.date<today ? "Learning target from "+fmtLong(state.date)
            : "Coming up on "+fmtLong(state.date);
  app.appendChild(el("p","meta", [fmtLong(state.date), row.unit].filter(Boolean).join(" — ")));
  const tsec=section(rel);
  const tgt=el("div","target"); tgt.appendChild(el("p","",row.target||"(No learning target entered yet)"));
  tsec.appendChild(tgt); app.appendChild(tsec);

  /* two columns */
  const grid=el("div","grid");
  const left=el("div","stack"), right=el("div","stack");

  const crit=splitList(row.criteria);
  if(crit.length){
    const card=el("div","card"); card.appendChild(el("h2","sec","I've got it when I can…"));
    const ul=el("ul","checks"); const saved=checks(); let done=0;
    const prog=el("p","progress");
    crit.forEach((text,i)=>{
      const key=checkKey(cls,row,i);
      const on=!!saved[key]; if(on) done++;
      const li=el("li"); const b=el("button","chk");
      b.setAttribute("role","checkbox"); b.setAttribute("aria-checked",on);
      b.appendChild(el("span","box")); b.appendChild(el("span","",text));
      b.onclick=()=>{
        toggleCheck(key);
        const nowOn=!!checks()[key];
        b.setAttribute("aria-checked",nowOn);
        updateProgress(ul,prog,crit.length);
      };
      li.appendChild(b); ul.appendChild(li);
    });
    card.appendChild(ul); card.appendChild(prog);
    updateProgress(ul,prog,crit.length);
    left.appendChild(card);
  }

  const ag=splitList(row.agenda);
  if(ag.length){
    const card=el("div","card"); card.appendChild(el("h2","sec","What we're doing"));
    const ul=el("ul","plain"); ag.forEach(x=>ul.appendChild(el("li","",x)));
    card.appendChild(ul); right.appendChild(card);
  }
  const vo=splitList(row.vocab,true);
  if(vo.length){
    const card=el("div","card tint"); card.appendChild(el("h2","sec","Words to know"));
    const t=el("div","terms"); vo.forEach(x=>t.appendChild(el("span","",x)));
    card.appendChild(t); right.appendChild(card);
  }
  if(left.children.length) grid.appendChild(left);
  if(right.children.length) grid.appendChild(right);
  if(!right.children.length) grid.style.gridTemplateColumns="1fr";
  app.appendChild(grid);

  if(row.standard) app.appendChild(el("p","std","Standard: "+row.standard));
  document.title=cls.name+" · Learning target";
}

function updateProgress(ul,prog,total){
  const n=ul.querySelectorAll('.chk[aria-checked="true"]').length;
  prog.textContent = n===total ? "You've checked off every one." : n+" of "+total+" checked. Tap each one when you're sure you can do it.";
  prog.classList.toggle("done", n===total);
}
function statusText(){
  if(state.mode==="live") return "Updated "+fmtTime(state.updated);
  if(state.mode==="cached") return "You're offline. Showing the last saved copy from "+fmtTime(state.updated)+".";
  if(state.mode==="demo") return "Demo data — not connected to your sheet.";
  if(state.mode==="file") return "Loaded from a test file.";
  return "";
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function chooseClass(code){
  state.classCode=code; state.date=todayIso(); state.period=null;
  LS.set("lt_class",code);
  const u=new URL(location.href); u.searchParams.set("class",code); history.replaceState(null,"",u);
  render();
}
async function refresh(){ await loadData(); render(); }

/* teacher tools */
if(TEACHER){
  $("teacherTools").hidden=false;
  const b=$("teacherBanner"); b.hidden=false;
  b.textContent="Teacher mode. Students will not see this bar or the setup buttons. Add ?date=YYYY-MM-DD to preview another day.";
  $("tRefresh").onclick=refresh;
  $("tSettings").onclick=()=>{ $("sUrl").value=LS.get("lt_url")||CONFIG.SHEET_CSV_URL||""; $("dlg").showModal(); };
  $("sCancel").onclick=()=>$("dlg").close();
  $("sDemo").onclick=async()=>{ LS.del("lt_url"); LS.del("lt_cache"); LS.del("lt_file"); await loadData(); $("dlg").close(); render(); };
  $("sSave").onclick=async()=>{
    const f=$("sFile").files[0], u=$("sUrl").value.trim();
    if(f){ LS.set("lt_file",await f.text()); LS.del("lt_url"); }
    else if(u){ LS.set("lt_url",u); LS.del("lt_file"); }
    await loadData(); $("dlg").close(); render();
  };
}

/* =====================================================================
   START
   ===================================================================== */
(async function init(){
  if(CONFIG.LOGO_SVG.trim()){
    $("logoSlot").innerHTML=CONFIG.LOGO_SVG;
    const s=$("logoSlot").querySelector("svg"); if(s) s.classList.add("logo");
  } else $("logoSlot").appendChild(el("div","logo-fallback","T"));

  await loadData();
  const wanted=classByCode(params.get("class")||LS.get("lt_class"));
  state.classCode = wanted ? wanted.code : null;
  state.date = todayIso();
  render();

  setInterval(refresh, CONFIG.REFRESH_MINUTES*60000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
})();
</script>
